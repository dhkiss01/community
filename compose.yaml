name: dugout
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: local-community
      MYSQL_ROOT_PASSWORD: local-root
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./community-BE/src/main/resources/db/search-outbox.sql:/docker-entrypoint-initdb.d/01-search.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-ucommunity", "-plocal-community", "-Dcommunity", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
  elasticsearch:
    build: ./community-BE/elasticsearch
    image: community-elasticsearch-nori:8.18.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19200:9200"]
    mem_limit: 2g
    volumes: ["search-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
  backend:
    build: ./community-BE
    environment:
      SPRING_PROFILES_ACTIVE: local,search
      DB_URL: jdbc:mysql://mysql:3306/community?serverTimezone=UTC&characterEncoding=UTF-8
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
  frontend:
    build: ./community-FE
    environment:
      API_UPSTREAM: http://backend:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  mysql-data:
  search-data:
