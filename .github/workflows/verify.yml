name: Verify develop and pull requests
on:
  push:
    branches: [develop, "feat/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: community
          MYSQL_USER: community
          MYSQL_PASSWORD: local-community
          MYSQL_ROOT_PASSWORD: local-root
        ports: ["13306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-root"
          --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: community-FE/package-lock.json
      - run: ./gradlew test bootJar --no-daemon
        working-directory: community-BE
      - run: npm ci && npm test
        working-directory: community-FE
      - name: Prepare search dependencies
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot -plocal-root community < community-BE/src/main/resources/db/search-outbox.sql
          docker build -t community-search-ci community-BE/elasticsearch
          docker run -d --name community-search-ci --memory=2g -p 127.0.0.1:19200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e 'ES_JAVA_OPTS=-Xms512m -Xmx512m' community-search-ci
          for attempt in $(seq 1 60); do
            curl -fsS 'http://localhost:19200/_cluster/health?wait_for_status=yellow&timeout=2s' && break
            sleep 2
          done
          curl -fsS 'http://localhost:19200/_cluster/health?wait_for_status=yellow&timeout=2s'
      - name: Start backend
        run: |
          java -jar community-BE/build/libs/*SNAPSHOT.jar --spring.profiles.active=local,search --spring.elasticsearch.uris=http://localhost:19200 --server.port=18080 > /tmp/dugout-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:18080/actuator/health && break
            sleep 2
          done
          curl -fsS http://localhost:18080/actuator/health
      - run: node scripts/integration-test.mjs
      - run: node scripts/auth-test.mjs
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: community-FE
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p test-diagnostics
          cp /tmp/dugout-backend.log test-diagnostics/ || true
          docker logs community-search-ci > test-diagnostics/elasticsearch.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            community-BE/build/reports/tests/
            community-FE/test-results/
            test-diagnostics/
      - if: always()
        run: docker rm -f community-search-ci || true
