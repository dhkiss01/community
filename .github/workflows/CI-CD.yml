name: Build and publish images
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: community-FE/package-lock.json
      - run: npm ci && npm test
        working-directory: community-FE
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test bootJar --no-daemon
        working-directory: community-BE
      # Runtime credentials are supplied by Kubernetes, never written into the image.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish backend and frontend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "zven408/community-be-app:$IMAGE_TAG" ./community-BE
          docker build -t "zven408/community-fe-app:$IMAGE_TAG" ./community-FE
          docker push "zven408/community-be-app:$IMAGE_TAG"
          docker push "zven408/community-fe-app:$IMAGE_TAG"
          echo "Backend: zven408/community-be-app:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: zven408/community-fe-app:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
