name: Deploy to EC2 SSM

on:
  push:
    branches:
      - main

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v6
      
      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24   
          

      # 3. 의존성 설치 및 빌드
      - name: Install dependencies
        run: npm ci
        working-directory: ./community-FE


      # 4. JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 5. Gradle 실행 권한 부여 (+x 로 수정)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./community-BE

      # 6. application.yaml 생성
      - name: Generate application.yaml
        run: |
          mkdir -p community-BE/src/main/resources
          echo "${{secrets.APPLICATION_YAML}}" > community-BE/src/main/resources/application.yaml

      # 7. Gradle 빌드
      - name: Build with Gradle
        run: ./gradlew build -x test
        working-directory: ./community-BE

      # 8. Docker 로그인
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 9. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker images
        run: |
          docker build -t zven408/community-be-app:1.0.0 ./community-BE
          docker push zven408/community-be-app:1.0.0

    