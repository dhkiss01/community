spring:
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_S3_REGION}
      stack:
        auto: false
      s3:
        bucket: ${AWS_S3_BUCKET}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  datasource:
    url: ${DB_URL}
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  elasticsearch:
    uris: http://localhost:9200

  data:
    elasticsearch:
      repositories:
        enabled: true

  profiles:
    active: development

logging:
  level:
    org.springframework.data.elasticsearch.client: TRACE
    co.elastic.clients: TRACE
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SKY}
  access-token-exp-seconds: 600
  refresh-token-exp-seconds: 12096000

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always