spring.datasource.url=${DB_URL:jdbc:mysql://localhost:13306/community?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_NAME:community}
spring.datasource.password=${DB_PASSWORD:local-community}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cloud.aws.credentials.access-key=local-placeholder
spring.cloud.aws.credentials.secret-key=local-placeholder
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=configure-s3-for-uploads
jwt.secret=${JWT_SKY:local-development-secret-change-before-deploy-32-bytes}
app.auth.secure-cookie=false
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
