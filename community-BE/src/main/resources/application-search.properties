app.search.enabled=true
app.search.index=${POST_SEARCH_INDEX:community-posts-v2}
app.search.batch-size=100
app.search.poll-interval-ms=250
app.search.reindex-on-startup=${POST_SEARCH_REINDEX:false}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=3s
