apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deploy
  namespace: dev

spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs

    spec:
      imagePullSecrets:
            - name: regcred
      containers:
        - name: frontend
          image: zven408/community-fe-app:1.0.3
          ports:
            - containerPort: 3000


          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10